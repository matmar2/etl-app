name: App Build & Release

# Triggered from the ETL back office (Admin → App Build & Release) via the GitHub API,
# or manually from the Actions tab. Does the actual EAS build / OTA update so no one
# needs a terminal. The Expo token lives only here, as the repo secret EXPO_TOKEN.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'build = native (App Store/TestFlight or ad-hoc); ota = JS-only over-the-air update'
        type: choice
        options: [build, ota]
        default: build
      profile:
        description: 'f2stestflight (TestFlight, auto-submitted) or adhoc (registered iPads)'
        type: choice
        options: [f2stestflight, adhoc]
        default: f2stestflight

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # One OTA reaches EVERY install: both channels (production = TestFlight + Jamf store build,
      # adhoc = ad-hoc installs) and both runtimes (current app.json version + the fleet's 1.0.0
      # embedded binaries). Mirrors app/deploy-ota.sh, including its native-import gate.
      - name: OTA update (JS only — all installs, both runtimes)
        if: ${{ inputs.mode == 'ota' }}
        run: |
          set -euo pipefail
          # Native-import gate (27 Jul crash-rollback incident): an OTA must never ship JS that
          # statically imports a native lib older binaries lack — registry-gate required.
          for lib in expo-camera expo-notifications; do
            if grep -rnE "^[[:space:]]*import[^;]* from ['\"]$lib" src App.tsx; then
              echo "✗ OTA BLOCKED: static import of '$lib' (native-abort risk on older binaries)"; exit 1
            fi
          done
          grep -q "requireOptionalNativeModule('ExpoCamera')" src/components/BarcodeScanner.tsx || { echo "✗ BarcodeScanner guard missing"; exit 1; }
          grep -q "requireOptionalNativeModule('ExpoPushTokenManager')" src/push.ts || { echo "✗ push.ts guard missing"; exit 1; }
          echo "✓ native-import gate passed"
          CUR=$(node -p "require('./app.json').expo.version")
          RUNTIMES="$CUR"; [ "$CUR" != "1.0.0" ] && RUNTIMES="$CUR 1.0.0"
          for V in $RUNTIMES; do
            sed -i "s/\"version\": \"$CUR\"/\"version\": \"$V\"/" app.json
            for CH in production adhoc; do
              eas update --channel "$CH" --platform ios --message "Back-office OTA (runtime $V)" --non-interactive
            done
            sed -i "s/\"version\": \"$V\"/\"version\": \"$CUR\"/" app.json
          done
          git checkout -- app.json

      - name: Native build (+ auto-submit to TestFlight)
        if: ${{ inputs.mode == 'build' }}
        run: eas build --platform ios --profile ${{ inputs.profile }} ${{ inputs.profile == 'f2stestflight' && '--auto-submit' || '' }} --non-interactive
